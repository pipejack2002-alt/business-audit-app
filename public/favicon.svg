<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="20" y1="26" x2="48" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#06b6d4" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="14" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Outer Shield -->
  <path d="M32 9L15 16.5V29.5C15 41 22.5 50.5 32 55C41.5 50.5 49 41 49 29.5V16.5L32 9Z" 
        fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Inner Compass Ring -->
  <circle cx="32" cy="30" r="11" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- Compass Star Points -->
  <path d="M32 17L34 27L44 29L34 31L32 41L30 31L20 29L30 27L32 17Z" fill="#1e293b" stroke="#06b6d4" stroke-width="1" opacity="0.7"/>

  <!-- Prominent Glowing Checkmark -->
  <path d="M24 30L29.5 36.5L42 21" 
        stroke="url(#checkGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
